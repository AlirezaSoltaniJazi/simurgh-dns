[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simurgh-dns"
version = "0.1.0"
description = "A cross-platform CLI tool to benchmark public DNS servers and set the fastest one"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Alireza Soltani" },
]
keywords = ["dns", "benchmark", "cli", "networking", "performance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "dnspython>=2.7",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
simurgh-dns = "simurgh_dns.cli:main"

[project.urls]
Homepage = "https://github.com/AlirezaSoltaniJazi/simurgh-dns"
Repository = "https://github.com/AlirezaSoltaniJazi/simurgh-dns"
Issues = "https://github.com/AlirezaSoltaniJazi/simurgh-dns/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/simurgh_dns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests requiring network",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104"]
"src/simurgh_dns/platform_dns/**" = ["S603", "S607"]
"src/simurgh_dns/benchmark.py" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["simurgh_dns"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
